name: QA visual do Laboratório (branch de testes)
on:
  push:
    branches:
      - fix/padrao-desktop-proporcao-20261031
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Iniciar site de testes
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/vorzax-next.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/vorzax-next.log
          exit 1
      - name: Conferir 15 demonstracoes nos 4 tamanhos
        run: node scripts/qa-laboratorio-visual.cjs
      - name: Salvar prints e medidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-prints-e-medidas
          path: qa-results/
          if-no-files-found: warn
